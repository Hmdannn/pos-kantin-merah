  <circle cx="520" cy="40" r="90" fill="#be123c" opacity="0.08"/><circle cx="40" cy="320" r="70" fill="#be123c" opacity="0.08"/><circle cx="560" cy="300" r="60" fill="#be123c" opacity="0.08"/><circle cx="100" cy="30" r="35" fill="#be123c" opacity="0.08"/>
